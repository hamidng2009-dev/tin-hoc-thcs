<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tin học THCS – Học dễ hiểu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap">
<style>
:root{--bg:#f1f3fb;--card:#fff;--ink:#1b2140;--mute:#5d6485;--line:#d8dcf0;--accent:#4b5bd7;--accent-ink:#fff;--soft:#e6e9fb;--ok:#1f9d57;--bad:#d64545;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1226;--card:#181c36;--ink:#e8ebfb;--mute:#9aa2c8;--line:#2a3058;--accent:#8c98ff;--accent-ink:#0d1030;--soft:#222850;--ok:#4cc382;--bad:#ff7b7b}}
:root[data-theme="dark"]{--bg:#0f1226;--card:#181c36;--ink:#e8ebfb;--mute:#9aa2c8;--line:#2a3058;--accent:#8c98ff;--accent-ink:#0d1030;--soft:#222850;--ok:#4cc382;--bad:#ff7b7b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}
header{padding:28px 16px 10px;max-width:820px;margin:0 auto}
h1{font-size:2rem;font-weight:800;margin:0;letter-spacing:-.02em}
h2{font-size:1.25rem;margin:0 0 8px}
.sub{color:var(--mute);margin:2px 0 0}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
nav div{max-width:820px;margin:0 auto;display:flex;gap:6px;overflow-x:auto}
main{max-width:820px;margin:0 auto;padding:16px 16px 56px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 14px;white-space:nowrap}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
details{border-top:1px solid var(--line);padding:10px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:600}
ul{margin:8px 0 0;padding-left:20px}li{margin:4px 0}
.f{background:var(--soft);border-radius:10px;padding:8px 12px;margin:10px 0;font-weight:600}
h4{margin:14px 0 6px;font-size:.95rem;color:var(--accent)}
input[type=search]{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
fieldset{border:0;padding:0;margin:0 0 12px}
legend{font-weight:600;padding:0;margin-bottom:4px}
.opt{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer}
.opt input{width:18px;height:18px;accent-color:var(--accent)}
.opt.ok{color:var(--ok);font-weight:600}.opt.bad{color:var(--bad);font-weight:600}
.sol{color:var(--mute);margin:6px 0 0}
.note{color:var(--mute);font-size:.9rem}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1>Tin học THCS – Học dễ hiểu</h1>
  <p class="sub">Tóm tắt từng bài, khái niệm cần nhớ, trắc nghiệm và tự luận cho Tin học lớp 6, 7, 8, 9 (sách Kết nối tri thức với cuộc sống).</p>
</header>
<nav aria-label="Chọn lớp"><div id="nv"></div></nav>
<main>
  <input type="search" id="s" placeholder="Tìm trong cả bốn lớp (ví dụ: bit, thư điện tử, thuật toán…)" aria-label="Tìm kiếm">
  <div id="mn"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const cache={};let g=6;
try{g=+localStorage.getItem('tin-grade')||6}catch(e){}
async function load(n){if(n in cache)return cache[n];try{const r=await fetch('du-lieu/lop'+n+'.json',{cache:'no-cache'});if(!r.ok)throw 0;cache[n]=await r.json()}catch(e){cache[n]=null}return cache[n]}
function lesson(b){
 const w=el('div');
 const u=el('ul');(b.tt||[]).forEach(t=>u.append(el('li',null,t)));w.append(u);
 if(b.kn)w.append(el('div','f','Khái niệm cần nhớ: '+b.kn));
 if((b.tn||[]).length){w.append(el('h4',null,'Trắc nghiệm'));
  b.tn.forEach((q,i)=>{const f=el('fieldset');f.append(el('legend',null,'Câu '+(i+1)+'. '+q.q));const ex=el('p','sol');ex.hidden=true;
   q.o.forEach((o,j)=>{const lb=el('label','opt'),r=document.createElement('input');r.type='radio';r.name='q'+Math.random();
    r.onchange=()=>{if(f.dataset.d)return;f.dataset.d=1;f.querySelectorAll('input').forEach(x=>x.disabled=true);
     f.querySelectorAll('.opt').forEach((l,k)=>{if(k===q.a)l.classList.add('ok');else if(k===j)l.classList.add('bad')});
     ex.textContent=(j===q.a?'Đúng. ':'Chưa đúng. ')+(q.g||'');ex.hidden=false};
    lb.append(r,document.createTextNode(String.fromCharCode(65+j)+'. '+o));f.append(lb)});
   f.append(ex);w.append(f)})}
 if((b.tl||[]).length){w.append(el('h4',null,'Tự luận (tự làm vào vở trước, rồi xem gợi ý)'));
  b.tl.forEach((x,i)=>{w.append(el('p',null,'<b>Bài '+(i+1)+'.</b> '+x[0]));const d=el('details');d.append(el('summary',null,'Xem gợi ý'),el('p','sol',x[1]));w.append(d)})}
 return w}
async function grade(){
 const m=$('mn');m.innerHTML='';const d=await load(g);
 if(!d){m.append(el('div','card','<h2>Lớp '+g+'</h2><p class="sub">Nội dung lớp này đang được cập nhật.</p>'));return}
 d.chude.forEach((c,ci)=>{const cd=el('div','card');cd.append(el('h2',null,c.ten));
  c.bai.forEach((b,bi)=>{const de=el('details');if(ci===0&&bi===0)de.open=true;de.append(el('summary',null,'Bài '+b.so+'. '+b.ten),lesson(b));cd.append(de)});m.append(cd)});
 m.append(el('p','note','Nội dung tóm tắt mang tính tham khảo. Hãy đối chiếu với sách giáo khoa và hướng dẫn của giáo viên.'))}
async function search(q){
 const m=$('mn');m.innerHTML='';const all=await Promise.all([6,7,8,9].map(load));let n=0;const box=el('div','card');box.append(el('h2',null,'Kết quả cho “'+q.replace(/[<>&]/g,'')+'”'));
 all.forEach((d,i)=>{if(!d)return;d.chude.forEach(c=>c.bai.forEach(b=>{const t=(b.ten+' '+(b.tt||[]).join(' ')+' '+(b.kn||'')).toLowerCase();if(t.includes(q)){n++;const de=el('details');de.append(el('summary',null,'Lớp '+[6,7,8,9][i]+' – Bài '+b.so+'. '+b.ten),lesson(b));box.append(de)}}))});
 if(!n)box.append(el('p','sub','Không tìm thấy kết quả. Thử từ khoá khác.'));m.append(box)}
function nav(){const nv=$('nv');nv.innerHTML='';[6,7,8,9].forEach(n=>{const b=el('button',null,'Lớp '+n);b.setAttribute('aria-pressed',n===g);b.onclick=()=>{g=n;try{localStorage.setItem('tin-grade',n)}catch(e){}$('s').value='';nav();grade()};nv.append(b)})}
let tm;$('s').oninput=e=>{clearTimeout(tm);const v=e.target.value.toLowerCase().trim();tm=setTimeout(()=>v.length>=2?search(v):grade(),250)};
nav();grade();
</script>
</body>
</html>
