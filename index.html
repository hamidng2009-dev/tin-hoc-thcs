<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tin học THCS – Học dễ hiểu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap">
<style>
:root{--bg:#f1f3fb;--card:#fff;--ink:#1b2140;--mute:#5d6485;--line:#d8dcf0;--accent:#4b5bd7;--accent-ink:#fff;--soft:#e6e9fb;--ok:#1f9d57;--bad:#d64545;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1226;--card:#181c36;--ink:#e8ebfb;--mute:#9aa2c8;--line:#2a3058;--accent:#8c98ff;--accent-ink:#0d1030;--soft:#222850;--ok:#4cc382;--bad:#ff7b7b}}
:root[data-theme="dark"]{--bg:#0f1226;--card:#181c36;--ink:#e8ebfb;--mute:#9aa2c8;--line:#2a3058;--accent:#8c98ff;--accent-ink:#0d1030;--soft:#222850;--ok:#4cc382;--bad:#ff7b7b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}
header{padding:28px 16px 10px;max-width:820px;margin:0 auto}
h1{font-size:2rem;font-weight:800;margin:0;letter-spacing:-.02em}
h2{font-size:1.35rem;margin:0 0 10px}
h3{font-size:1.05rem;margin:0 0 6px}
a{color:var(--accent);font-weight:600}
.sub{color:var(--mute);margin:2px 0 0}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
nav div{max-width:820px;margin:0 auto;display:flex;gap:6px;overflow-x:auto}
nav button{white-space:nowrap}
main{max-width:820px;margin:0 auto;padding:16px 16px 56px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 14px}
button[aria-current="page"],button[aria-pressed="true"],button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
details{border-top:1px solid var(--line);padding:10px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:600}
ul{margin:8px 0 0;padding-left:20px}
li{margin:4px 0}
.f{background:var(--soft);border-radius:10px;padding:8px 12px;margin:8px 0 4px;font-weight:600}
.tag{display:inline-block;font-size:.78rem;padding:1px 9px;border-radius:99px;background:var(--soft);color:var(--accent);font-weight:600}
input[type=search]{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:8px}
fieldset{border:0;padding:0;margin:0 0 14px}
legend{font-weight:600;padding:0;margin-bottom:4px}
.opt{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer}
.opt input{width:18px;height:18px;accent-color:var(--accent)}
.opt.ok{color:var(--ok);font-weight:600}.opt.bad{color:var(--bad);font-weight:600}
.res{margin-top:10px;font-weight:600}
.sol{color:var(--mute);margin:6px 0 0}
.note{color:var(--mute);font-size:.9rem}
[hidden]{display:none!important}
</style>
</head>

</header>
<nav aria-label="Mục chính"><div id="nv"></div></nav>
<main id="mn"></main>

qs:[

qs:[

["Biến trong chương trình dùng để làm gì?",["Trang trí giao diện","Lưu giá trị có thể thay đổi","Tắt chương trình","Kết nối mạng"],1,"Giá trị của biến có thể đổi trong lúc chạy."],
["Khối “lặp lại 10 lần” thuộc cấu trúc nào?",["Tuần tự","Rẽ nhánh","Lặp","Nhập dữ liệu"],2,"Lặp giúp thực hiện lại một nhóm lệnh."],
["Bài trình chiếu tốt nên như thế nào?",["Nhiều chữ nhỏ","Ít chữ, rõ ý, có hình minh hoạ","Nhiều màu sặc sỡ","Không cần hình"],1,"Ngắn gọn, dễ nhìn, dễ hiểu."],
["Để tìm thông tin chính xác hơn nên làm gì?",["Dùng từ khoá cụ thể","Gõ một chữ duy nhất","Chỉ đọc tiêu đề","Tin mọi kết quả"],0,"Từ khoá cụ thể giúp thu hẹp kết quả."],
["Gỡ lỗi (debug) là gì?",["Xoá chương trình","Tìm và sửa lỗi","Viết thêm lệnh","Tắt máy"],1,"Kiểm tra chương trình và sửa chỗ sai."]],
tl:[["Mô tả thuật toán: nếu điểm ≥ 5 thì in “Đạt”, ngược lại in “Chưa đạt”.","Gợi ý: nhập điểm → nếu điểm ≥ 5 thì in “Đạt”, nếu không thì in “Chưa đạt”."],
["Nêu 3 lỗi thường gặp khi làm bài trình chiếu.","Gợi ý: quá nhiều chữ, màu chữ khó đọc, hiệu ứng rối mắt."]]},
9:{topics:[
["Thiết bị thông minh và AI",["IoT (Internet vạn vật): các thiết bị kết nối Internet để thu thập và trao đổi dữ liệu.","Trí tuệ nhân tạo (AI) là hệ thống mô phỏng một số khả năng của con người như nhận dạng, dự đoán.","Cần kiểm chứng thông tin do AI tạo ra."],"IoT, AI, dữ liệu, kiểm chứng"],
["Internet an toàn và pháp luật",["Lừa đảo trực tuyến (phishing): giả mạo để đánh cắp thông tin.","Bật xác thực hai yếu tố để tăng bảo mật tài khoản.","Tuân thủ pháp luật, tôn trọng bản quyền và quyền riêng tư."],"Phishing, xác thực hai yếu tố, bản quyền"],
["Lập trình và hướng nghiệp",["Quy trình: xác định bài toán → thiết kế thuật toán → viết chương trình → kiểm thử, gỡ lỗi.","Chia bài toán lớn thành các bài toán nhỏ dễ giải quyết hơn.","Tìm hiểu các nghề liên quan đến công nghệ thông tin."],"Kiểm thử, gỡ lỗi, chia nhỏ bài toán, hướng nghiệp"]],
qs:[
["IoT là viết tắt của khái niệm nào?",["Internet vạn vật","Máy tính cá nhân","Mạng nội bộ","Phần mềm diệt virus"],0,"Internet of Things."],
["Phishing là gì?",["Một trò chơi","Giả mạo để đánh cắp thông tin","Một loại bàn phím","Phần mềm soạn thảo"],1,"Kẻ xấu giả làm nơi đáng tin để lừa người dùng."],

try{g=+localStorage.getItem('tin-grade')||6}catch(e){}
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

V.kt=()=>{const w=el('div');w.style.cssText='display:grid;gap:14px';
 const c=card();c.append(el('h2',null,'Kiến thức cơ bản – Tin học '+g));
 const s=document.createElement('input');s.type='search';s.placeholder='Tìm nhanh (ví dụ: bit, biến, SUM…)';s.setAttribute('aria-label','Tìm nhanh');c.append(s);
 const ds=D[g].topics.map((t,i)=>{const d=el('details');if(i===0)d.open=true;d.append(el('summary',null,t[0]));const u=el('ul');t[1].forEach(p=>u.append(el('li',null,p)));d.append(u,el('div','f','Khái niệm: '+t[2]));c.append(d);return d});
 s.oninput=()=>{const v=s.value.toLowerCase().trim();ds.forEach(d=>{const hit=!v||d.textContent.toLowerCase().includes(v);d.hidden=!hit;if(v&&hit)d.open=true})};

V.lt=()=>{const qs=shuf(D[g].qs);let sc=0,dn=0;

 qs.forEach((q,i)=>{const f=el('fieldset');f.append(el('legend',null,'Câu '+(i+1)+'. '+q[0]));const ex=el('p','sol');ex.hidden=true;
  q[1].forEach((o,j)=>{const lb=el('label','opt');const r=document.createElement('input');r.type='radio';r.name='q'+i;
   r.onchange=()=>{if(f.dataset.d)return;f.dataset.d=1;f.querySelectorAll('input').forEach(x=>x.disabled=true);
    f.querySelectorAll('.opt').forEach((l,k)=>{if(k===q[2])l.classList.add('ok');else if(k===j)l.classList.add('bad')});
    if(j===q[2])sc++;dn++;ex.textContent=(j===q[2]?'Đúng. ':'Chưa đúng. ')+q[3];ex.hidden=false;
    sd.textContent='Điểm: '+sc+'/'+qs.length+(dn===qs.length?(sc===qs.length?' – Xuất sắc!':' – Hoàn thành, hãy xem lại các câu sai.'):'')};
   lb.append(r,document.createTextNode(String.fromCharCode(65+j)+'. '+o));f.append(lb)});
  f.append(ex);c.append(f)});return c};
V.tl=()=>{const c=card();c.append(el('h2',null,'Bài tập tự luận – Tin học '+g),el('p','sub','Hãy tự làm vào vở trước, sau đó mới xem gợi ý.'));
 D[g].tl.forEach((x,i)=>{c.append(el('p',null,'<b>Bài '+(i+1)+'.</b> '+x[0]));const d=el('details');d.append(el('summary',null,'Xem gợi ý'),el('p','sol',x[1]));c.append(d)});return c};

 const m=$('mn');m.innerHTML='';m.append(V[k]());window.scrollTo(0,0)}

 [6,7,8,9].forEach(n=>{const b=el('button',null,'Lớp '+n);b.setAttribute('aria-pressed',n===g);b.onclick=()=>{g=n;try{localStorage.setItem('tin-grade',n)}catch(e){}buildNav();show(sec)};nv.append(b)});
 NAV.forEach(([k,t])=>{const b=el('button',null,t);b.dataset.k=k;b.onclick=()=>show(k);nv.append(b)})}
buildNav();show('kt');
